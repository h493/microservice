spring:
  application:
    name: api-gateway

# api gateway configuration
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/orders/**
#                - Method = GET, POST
              filters:
                - name : LoggingOrdersFilter
                - name: Authentication
                  args:
                    isEnabled: true
            - id: inventory-service
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/inventory/**
            - id: shipping-service
              uri: lb://SHIPPING-SERVICE
              predicates:
                - Path=/shipping/**
              filters:
                - name: Authentication

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka


